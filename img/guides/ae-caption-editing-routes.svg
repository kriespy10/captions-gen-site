<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title description">
<title id="title">Caption editor save versus manual Source Text changes</title><desc id="description">The panel editor saves caption text and animation together. Manual Source Text editing inside a generated precomposition requires returning to the parent, selecting the changed caption and using Update animation when offered. Both routes need a timing review; audio alignment is conditional.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#0a84ff" stroke-width="1.8"/></marker></defs>
<rect width="960" height="900" rx="24" fill="#101013"/><rect width="960" height="900" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="44" y="55" fill="#ffeb3b" font-size="20" font-weight="700" text-anchor="start"><tspan x="44" dy="0">AFTER EFFECTS · WORKFLOW ILLUSTRATION</tspan></text><text x="44" y="112" fill="#f4f4f5" font-size="40" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Two text edits. Two timing paths.</tspan></text><text x="44" y="154" fill="#b0b0bc" font-size="24" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Use the route that matches how you changed the words.</tspan></text><text x="60" y="218" fill="#0a84ff" font-size="28" font-weight="650" text-anchor="start"><tspan x="60" dy="0">Panel caption editor</tspan></text><rect x="40" y="242" width="420" height="402" rx="16" fill="#19191f" stroke="#0a84ff"/><text x="520" y="218" fill="#b8a8ff" font-size="28" font-weight="650" text-anchor="start"><tspan x="520" dy="0">Manual Source Text edit</tspan></text><rect x="500" y="242" width="420" height="402" rx="16" fill="#19191f" stroke="#b8a8ff"/><text x="64" y="277" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="64" dy="0">Open Captions</tspan></text><text x="64" y="309" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Choose the caption to edit.</tspan></text><path d="M250 322 L250 342" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="372" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="64" dy="0">Correct the words</tspan></text><text x="64" y="404" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Check the intended phrase.</tspan></text><path d="M250 417 L250 437" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="467" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="64" dy="0">Save caption</tspan></text><text x="64" y="499" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Writes text and animation.</tspan></text><path d="M250 512 L250 532" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="562" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="64" dy="0">Preview with audio</tspan></text><text x="64" y="594" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Review added-word timing.</tspan></text><text x="524" y="277" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="524" dy="0">Edit Source Text</tspan></text><text x="524" y="309" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="524" dy="0">Inside the generated precomp.</tspan></text><path d="M710 322 L710 342" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><text x="524" y="372" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="524" dy="0">Return to parent</tspan></text><text x="524" y="404" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="524" dy="0">Select the changed caption.</tspan></text><path d="M710 417 L710 437" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><text x="524" y="467" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="524" dy="0">Caption text changed</tspan></text><text x="524" y="499" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="524" dy="0">Update animation when offered.</tspan></text><path d="M710 512 L710 532" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><text x="524" y="562" fill="#f4f4f5" font-size="27" font-weight="650" text-anchor="start"><tspan x="524" dy="0">Preview with audio</tspan></text><text x="524" y="594" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="524" dy="0">Review added-word timing.</tspan></text><rect x="40" y="683" width="880" height="131" rx="16" fill="#202019" stroke="#655e25"/><text x="66" y="724" fill="#ffeb3b" font-size="25" font-weight="650" text-anchor="start"><tspan x="66" dy="0">A normal Save caption needs no extra Update animation step.</tspan></text><text x="66" y="766" fill="#b0b0bc" font-size="24" font-weight="400" text-anchor="start"><tspan x="66" dy="0">Added words can align to valid original audio.</tspan><tspan x="66" dy="35">If alignment is unavailable, timings may be estimated.</tspan></text><text x="44" y="872" fill="#b0b0bc" font-size="19" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Captions Gen 1.1.9 · Illustration, not an Adobe screenshot</tspan></text></g></svg>