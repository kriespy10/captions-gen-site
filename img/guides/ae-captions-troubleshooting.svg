<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title description">
<title id="title">Troubleshoot missing panels, generation and caption visibility</title><desc id="description">Three diagnostic branches: check installation for a missing extension; check the engine, model and supported source for no generated layers; check time, visibility, Solo and render range for existing invisible layers. Shy alone does not stop rendering.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#0a84ff" stroke-width="1.8"/></marker></defs>
<rect width="960" height="880" rx="24" fill="#101013"/><rect width="960" height="880" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="44" y="55" fill="#ffeb3b" font-size="20" font-weight="700" text-anchor="start"><tspan x="44" dy="0">AFTER EFFECTS · WORKFLOW ILLUSTRATION</tspan></text><text x="44" y="112" fill="#f4f4f5" font-size="42" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Find the stage that failed</tspan></text><text x="44" y="154" fill="#b0b0bc" font-size="24" font-weight="400" text-anchor="start"><tspan x="44" dy="0">A missing panel and an invisible layer need different checks.</tspan></text><rect x="40" y="210" width="365" height="140" rx="16" fill="#19191f" stroke="#0a84ff"/><text x="62" y="267" fill="#0a84ff" font-size="28" font-weight="650" text-anchor="start"><tspan x="62" dy="0">Panel missing?</tspan></text><text x="62" y="311" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="62" dy="0">Choose this branch first.</tspan></text><path d="M414 280 L452 280" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="462" y="210" width="458" height="140" rx="16" fill="#19191f" stroke="#373740"/><text x="484" y="265" fill="#f4f4f5" font-size="25" font-weight="600" text-anchor="start"><tspan x="484" dy="0">Check Window &gt; Extensions.</tspan><tspan x="484" dy="36">Install AE or Both in Setup.</tspan></text><rect x="40" y="390" width="365" height="140" rx="16" fill="#19191f" stroke="#b8a8ff"/><text x="62" y="447" fill="#b8a8ff" font-size="28" font-weight="650" text-anchor="start"><tspan x="62" dy="0">No generated layers?</tspan></text><text x="62" y="491" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="62" dy="0">Choose this branch first.</tspan></text><path d="M414 460 L452 460" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="462" y="390" width="458" height="140" rx="16" fill="#19191f" stroke="#373740"/><text x="484" y="445" fill="#f4f4f5" font-size="25" font-weight="600" text-anchor="start"><tspan x="484" dy="0">Check engine and model.</tspan><tspan x="484" dy="36">Select supported speech media.</tspan></text><rect x="40" y="570" width="365" height="140" rx="16" fill="#19191f" stroke="#ffeb3b"/><text x="62" y="627" fill="#ffeb3b" font-size="28" font-weight="650" text-anchor="start"><tspan x="62" dy="0">Existing layer invisible?</tspan></text><text x="62" y="671" fill="#b0b0bc" font-size="21" font-weight="400" text-anchor="start"><tspan x="62" dy="0">Choose this branch first.</tspan></text><path d="M414 640 L452 640" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="462" y="570" width="458" height="140" rx="16" fill="#19191f" stroke="#373740"/><text x="484" y="625" fill="#f4f4f5" font-size="25" font-weight="600" text-anchor="start"><tspan x="484" dy="0">Check time, Video and Solo.</tspan><tspan x="484" dy="36">Review stack and render range.</tspan></text><rect x="40" y="750" width="880" height="60" rx="12" fill="#252033" stroke="#655a82"/><text x="480" y="789" fill="#b8a8ff" font-size="25" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">Shy hides timeline rows. It does not itself stop rendering.</tspan></text><text x="44" y="852" fill="#b0b0bc" font-size="19" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Captions Gen 1.1.9 · Illustration, not an Adobe screenshot</tspan></text></g></svg>