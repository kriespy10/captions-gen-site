<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="title description">
<title id="title">First animated captions in After Effects</title><desc id="description">Four conceptual steps: select supported speech footage, use the local CPU model, generate editable caption phrase layers, then render the composition. Subtitle files remain a separate delivery.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#0a84ff" stroke-width="1.8"/></marker></defs>
<rect width="960" height="860" rx="24" fill="#101013"/><rect width="960" height="860" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="44" y="55" fill="#ffeb3b" font-size="20" font-weight="700" text-anchor="start"><tspan x="44" dy="0">AFTER EFFECTS · WORKFLOW ILLUSTRATION</tspan></text><text x="44" y="112" fill="#f4f4f5" font-size="42" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Your first AE caption batch</tspan></text><text x="44" y="153" fill="#b0b0bc" font-size="26" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Selected speech becomes editable caption layers.</tspan></text><rect x="40" y="200" width="420" height="235" rx="16" fill="#19191f" stroke="#0a84ff"/><text x="62" y="237" fill="#0a84ff" font-size="20" font-weight="700" text-anchor="start"><tspan x="62" dy="0">01  SELECT SPEECH</tspan></text><text x="62" y="281" fill="#f4f4f5" font-size="28" font-weight="650" text-anchor="start"><tspan x="62" dy="0">Audio or video layer</tspan></text><rect x="500" y="200" width="420" height="235" rx="16" fill="#19191f" stroke="#b8a8ff"/><text x="522" y="237" fill="#b8a8ff" font-size="20" font-weight="700" text-anchor="start"><tspan x="522" dy="0">02  TRANSCRIBE LOCALLY</tspan></text><text x="522" y="281" fill="#f4f4f5" font-size="28" font-weight="650" text-anchor="start"><tspan x="522" dy="0">CPU speech model</tspan></text><rect x="40" y="485" width="420" height="235" rx="16" fill="#19191f" stroke="#b8a8ff"/><text x="62" y="522" fill="#b8a8ff" font-size="20" font-weight="700" text-anchor="start"><tspan x="62" dy="0">03  GENERATE CAPTIONS</tspan></text><text x="62" y="566" fill="#f4f4f5" font-size="28" font-weight="650" text-anchor="start"><tspan x="62" dy="0">Editable phrase layers</tspan></text><rect x="500" y="485" width="420" height="235" rx="16" fill="#19191f" stroke="#0a84ff"/><text x="522" y="522" fill="#0a84ff" font-size="20" font-weight="700" text-anchor="start"><tspan x="522" dy="0">04  RENDER THE COMPOSITION</tspan></text><text x="522" y="566" fill="#f4f4f5" font-size="28" font-weight="650" text-anchor="start"><tspan x="522" dy="0">Words in the picture</tspan></text><text x="62" y="322" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="62" dy="0">Online file · audio enabled</tspan><tspan x="62" dy="33">Normal speed · selected range</tspan></text><polyline points="65,398 90,398 100,380 110,410 121,365 135,415 150,385 170,398 195,398 207,375 217,410 230,387 250,398 420,398" fill="none" stroke="#0a84ff" stroke-width="3"/><text x="522" y="322" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="522" dy="0">Base, Small or Turbo</tspan><tspan x="522" dy="33">Wait for the selected model.</tspan></text><rect x="522" y="382" width="125" height="30" rx="7" fill="#24243a" stroke="#665d98"/><rect x="657" y="382" width="110" height="30" rx="7" fill="#24243a" stroke="#665d98"/><rect x="777" y="382" width="120" height="30" rx="7" fill="#24243a" stroke="#665d98"/><text x="584" y="403" fill="#b8a8ff" font-size="19" font-weight="600" text-anchor="middle"><tspan x="584" dy="0">Base</tspan></text><text x="712" y="403" fill="#b8a8ff" font-size="19" font-weight="600" text-anchor="middle"><tspan x="712" dy="0">Small</tspan></text><text x="837" y="403" fill="#b8a8ff" font-size="19" font-weight="600" text-anchor="middle"><tspan x="837" dy="0">Turbo</tspan></text><rect x="63" y="585" width="155" height="28" rx="6" fill="#37304d" stroke="#8c7abf"/><rect x="227" y="619" width="160" height="28" rx="6" fill="#37304d" stroke="#8c7abf"/><text x="75" y="605" fill="#f4f4f5" font-size="18" font-weight="400" text-anchor="start"><tspan x="75" dy="0">Caption phrase 1</tspan></text><text x="239" y="639" fill="#f4f4f5" font-size="18" font-weight="400" text-anchor="start"><tspan x="239" dy="0">Caption phrase 2</tspan></text><text x="63" y="691" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="63" dy="0">Review words and timing.</tspan></text><rect x="523" y="587" width="373" height="64" rx="10" fill="#15263b" stroke="#35475f"/><text x="710" y="630" fill="#ffeb3b" font-size="30" font-weight="750" text-anchor="middle"><tspan x="710" dy="0">MAKE IT CLEAR</tspan></text><text x="522" y="691" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="522" dy="0">Keep SRT delivery separate.</tspan></text><path d="M464 316 L494 316" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M464 603 L494 603" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M710 442V459H250V478" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="746" width="880" height="53" rx="12" fill="#202019" stroke="#655e25"/><text x="480" y="781" fill="#ffeb3b" font-size="24" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">Save the project. Render a short sample and watch it with sound.</tspan></text><text x="44" y="832" fill="#b0b0bc" font-size="19" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Captions Gen 1.1.9 · Illustration, not an Adobe screenshot</tspan></text></g></svg>