<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title description">
<title id="title">One-word grouping versus phrase karaoke highlights</title><desc id="description">Three frames show MAKE, then IT, then CLEAR as separate one-word groups. Another three keep MAKE IT CLEAR visible while only the yellow active word moves. Timing is illustrative, not an audio measurement.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#0a84ff" stroke-width="1.8"/></marker></defs>
<rect width="960" height="880" rx="24" fill="#101013"/><rect width="960" height="880" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="44" y="55" fill="#ffeb3b" font-size="20" font-weight="700" text-anchor="start"><tspan x="44" dy="0">AFTER EFFECTS · WORKFLOW ILLUSTRATION</tspan></text><text x="44" y="112" fill="#f4f4f5" font-size="38" font-weight="700" text-anchor="start"><tspan x="44" dy="0">One word or one moving highlight?</tspan></text><text x="44" y="154" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Grouping controls the phrase. Karaoke controls the active word.</tspan></text><text x="44" y="224" fill="#f4f4f5" font-size="29" font-weight="650" text-anchor="start"><tspan x="44" dy="0">One word at a time</tspan></text><text x="44" y="261" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Caption text: Min words 1 · Max words 1</tspan></text><rect x="40" y="286" width="270" height="132" rx="16" fill="#15263b" stroke="#35475f"/><text x="175" y="365" fill="#ffeb3b" font-size="43" font-weight="750" text-anchor="middle"><tspan x="175" dy="0">MAKE</tspan></text><text x="175" y="452" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="175" dy="0">Step 1</tspan></text><path d="M317 351 L336 351" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="345" y="286" width="270" height="132" rx="16" fill="#15263b" stroke="#35475f"/><text x="480" y="365" fill="#ffeb3b" font-size="43" font-weight="750" text-anchor="middle"><tspan x="480" dy="0">IT</tspan></text><text x="480" y="452" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">Step 2</tspan></text><path d="M622 351 L641 351" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="286" width="270" height="132" rx="16" fill="#15263b" stroke="#35475f"/><text x="785" y="365" fill="#ffeb3b" font-size="43" font-weight="750" text-anchor="middle"><tspan x="785" dy="0">CLEAR</tspan></text><text x="785" y="452" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="785" dy="0">Step 3</tspan></text><text x="44" y="516" fill="#f4f4f5" font-size="29" font-weight="650" text-anchor="start"><tspan x="44" dy="0">Phrase with a moving highlight</tspan></text><text x="44" y="553" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Several words per group · Karaoke enabled</tspan></text><rect x="40" y="580" width="270" height="132" rx="16" fill="#15263b" stroke="#35475f"/><text x="175" y="657" font-size="27" font-weight="750" text-anchor="middle"><tspan fill="#ffeb3b">MAKE</tspan> <tspan fill="#f4f4f5">IT</tspan> <tspan fill="#f4f4f5">CLEAR</tspan></text><path d="M317 645 L336 645" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="345" y="580" width="270" height="132" rx="16" fill="#15263b" stroke="#35475f"/><text x="480" y="657" font-size="27" font-weight="750" text-anchor="middle"><tspan fill="#f4f4f5">MAKE</tspan> <tspan fill="#ffeb3b">IT</tspan> <tspan fill="#f4f4f5">CLEAR</tspan></text><path d="M622 645 L641 645" fill="none" stroke="#0a84ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="580" width="270" height="132" rx="16" fill="#15263b" stroke="#35475f"/><text x="785" y="657" font-size="27" font-weight="750" text-anchor="middle"><tspan fill="#f4f4f5">MAKE</tspan> <tspan fill="#f4f4f5">IT</tspan> <tspan fill="#ffeb3b">CLEAR</tspan></text><text x="44" y="779" fill="#b0b0bc" font-size="24" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Illustrated sequence. Check actual word timing against speech.</tspan></text><text x="44" y="816" fill="#b8a8ff" font-size="23" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Karaoke supports up to 8 words per caption in the public panel.</tspan></text><text x="44" y="852" fill="#b0b0bc" font-size="19" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Captions Gen 1.1.9 · Illustration, not an Adobe screenshot</tspan></text></g></svg>