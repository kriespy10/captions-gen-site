<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title description">
<title id="title">Selected layer range versus composition work area</title><desc id="description">Illustrated 12-second composition: the selected layer is visible from 2 to 10 seconds, while the work area is 4 to 7 seconds. Captions Gen uses the selected supported layer range, clipped to media and composition bounds, not only the work area.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#0a84ff" stroke-width="1.8"/></marker></defs>
<rect width="960" height="760" rx="24" fill="#101013"/><rect width="960" height="760" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="44" y="55" fill="#ffeb3b" font-size="20" font-weight="700" text-anchor="start"><tspan x="44" dy="0">AFTER EFFECTS · WORKFLOW ILLUSTRATION</tspan></text><text x="44" y="112" fill="#f4f4f5" font-size="39" font-weight="700" text-anchor="start"><tspan x="44" dy="0">The layer range chooses the input</tspan></text><text x="44" y="154" fill="#b0b0bc" font-size="24" font-weight="400" text-anchor="start"><tspan x="44" dy="0">The work area controls a separate preview or render range.</tspan></text><rect x="40" y="191" width="880" height="400" rx="16" fill="#19191f" stroke="#373740"/><path d="M140 235V560" stroke="#ffffff" stroke-opacity=".10"/><text x="140" y="225" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="140" dy="0">0s</tspan></text><path d="M260 235V560" stroke="#ffffff" stroke-opacity=".10"/><text x="260" y="225" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="260" dy="0">2s</tspan></text><path d="M380 235V560" stroke="#ffffff" stroke-opacity=".10"/><text x="380" y="225" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="380" dy="0">4s</tspan></text><path d="M500 235V560" stroke="#ffffff" stroke-opacity=".10"/><text x="500" y="225" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">6s</tspan></text><path d="M620 235V560" stroke="#ffffff" stroke-opacity=".10"/><text x="620" y="225" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="620" dy="0">8s</tspan></text><path d="M740 235V560" stroke="#ffffff" stroke-opacity=".10"/><text x="740" y="225" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="740" dy="0">10s</tspan></text><path d="M860 235V560" stroke="#ffffff" stroke-opacity=".10"/><text x="860" y="225" fill="#b0b0bc" font-size="20" font-weight="400" text-anchor="middle"><tspan x="860" dy="0">12s</tspan></text><text x="68" y="273" fill="#f4f4f5" font-size="24" font-weight="650" text-anchor="start"><tspan x="68" dy="0">Selected source layer</tspan></text><rect x="260" y="291" width="480" height="49" rx="8" fill="#38304f" stroke="#b8a8ff"/><text x="500" y="324" fill="#b8a8ff" font-size="23" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">Visible layer: 2s to 10s</tspan></text><text x="68" y="379" fill="#f4f4f5" font-size="24" font-weight="650" text-anchor="start"><tspan x="68" dy="0">Composition work area</tspan></text><rect x="380" y="397" width="180" height="45" rx="8" fill="#17314a" stroke="#0a84ff"/><text x="470" y="428" fill="#99ccff" font-size="22" font-weight="600" text-anchor="middle"><tspan x="470" dy="0">4s to 7s</tspan></text><text x="68" y="483" fill="#f4f4f5" font-size="24" font-weight="650" text-anchor="start"><tspan x="68" dy="0">Captions Gen input in this example</tspan></text><rect x="260" y="501" width="480" height="49" rx="8" fill="#3a3513" stroke="#ffeb3b"/><text x="500" y="534" fill="#ffeb3b" font-size="22" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">Selected supported range: 2s to 10s</tspan></text><text x="48" y="634" fill="#f4f4f5" font-size="25" font-weight="600" text-anchor="start"><tspan x="48" dy="0">The plugin reads the underlying selected media file.</tspan></text><text x="48" y="675" fill="#b0b0bc" font-size="23" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Source and composition bounds still apply.</tspan><tspan x="48" dy="33">Changing only work-area handles does not trim this input.</tspan></text><text x="44" y="732" fill="#b0b0bc" font-size="19" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Captions Gen 1.1.9 · Illustration, not an Adobe screenshot</tspan></text></g></svg>