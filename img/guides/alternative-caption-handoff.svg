<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="title description"><title id="title">Choose what stays editable</title><desc id="description">A rendered video carries visible pixels. An SRT carries text and timing without animated graphic design. Captions Gen generates editable Motion Graphics clips in the Premiere project.</desc><rect width="960" height="860" rx="24" fill="#101013"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="52" font-size="21" fill="#ffdf49" font-weight="700">WORKFLOW ILLUSTRATION</text><text x="48" y="110" font-size="40" fill="#f4f4f5" font-weight="700">Choose what stays editable</text><text x="48" y="155" font-size="26" fill="#b5b5bf" font-weight="400">The visible result and the editable source are different things.</text><rect x="40" y="196" width="880" height="173" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="235" font-size="22" fill="#b9acff" font-weight="700">RENDERED VIDEO</text><text x="68" y="280" font-size="32" fill="#f4f4f5" font-weight="650">Keeps the look as pixels</text><text x="68" y="325" font-size="27" fill="#b5b5bf" font-weight="400">No separate caption text or animation controls.</text><rect x="40" y="389" width="880" height="173" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="428" font-size="22" fill="#64bdff" font-weight="700">SRT SUBTITLE FILE</text><text x="68" y="473" font-size="32" fill="#f4f4f5" font-weight="650">Keeps text and timing</text><text x="68" y="518" font-size="27" fill="#b5b5bf" font-weight="400">Animated highlights and graphic design do not travel.</text><rect x="40" y="582" width="880" height="173" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="621" font-size="22" fill="#ffdf49" font-weight="700">CAPTIONS GEN IN PREMIERE</text><text x="68" y="666" font-size="32" fill="#f4f4f5" font-weight="650">Creates editable graphic clips</text><text x="68" y="711" font-size="27" fill="#b5b5bf" font-weight="400">For SRT delivery, keep a separate native caption track.</text><text x="48" y="830" font-size="21" fill="#81818d" font-weight="400">Illustration, not a native app screenshot · Captions Gen guides</text></g></svg>
