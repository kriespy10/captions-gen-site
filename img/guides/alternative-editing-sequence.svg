<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title description"><title id="title">Finish the cut, then test captions</title><desc id="description">A proposed workflow for using editing tools with Captions Gen: finish structural edits, duplicate the sequence, generate from the intended speech clip, review the result. No cross-plugin compatibility is certified.</desc><rect width="960" height="760" rx="24" fill="#101013"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="52" font-size="21" fill="#ffdf49" font-weight="700">WORKFLOW ILLUSTRATION</text><text x="48" y="110" font-size="40" fill="#f4f4f5" font-weight="700">Finish the cut, then test captions</text><text x="48" y="155" font-size="26" fill="#b5b5bf" font-weight="400">A proposed workflow, not a cross-plugin compatibility test.</text><rect x="40" y="194" width="880" height="133" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="233" font-size="22" fill="#b9acff" font-weight="700">1  FINISH THE PICTURE EDIT</text><text x="68" y="278" font-size="32" fill="#f4f4f5" font-weight="650">Make the structural cuts first</text><rect x="40" y="345" width="880" height="133" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="384" font-size="22" fill="#64bdff" font-weight="700">2  DUPLICATE THE SEQUENCE</text><text x="68" y="429" font-size="32" fill="#f4f4f5" font-weight="650">Keep the original captions as a reference</text><rect x="40" y="496" width="880" height="133" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="535" font-size="22" fill="#ffdf49" font-weight="700">3  GENERATE AND REVIEW</text><text x="68" y="580" font-size="32" fill="#f4f4f5" font-weight="650">Use the intended speech clip, then listen</text><text x="68" y="678" font-size="27" fill="#b5b5bf" font-weight="400">Late cut? Recheck or regenerate the affected captions.</text><text x="48" y="730" font-size="21" fill="#81818d" font-weight="400">Illustration, not a native app screenshot · Captions Gen guides</text></g></svg>
