<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title description">
  <title id="title">Convert native captions to editable graphics while keeping a subtitle copy</title>
  <desc id="description">A native caption track sits above a video. Keep a duplicate sequence for subtitle delivery. In the animation copy, select captions and choose Graphics and Titles, Upgrade Caption to Graphic. The result is graphics on a video track. Export SRT from the retained native-caption sequence.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern></defs>
  <rect width="960" height="900" rx="24" fill="#101013"/>
  <rect width="960" height="900" rx="24" fill="url(#grid)"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="48" y="61" fill="#ffeb3b" font-size="24" font-weight="700" letter-spacing="2">CAPTIONS TO GRAPHICS</text>
    <text x="48" y="115" fill="#f4f4f5" font-size="43" font-weight="700" letter-spacing="-1">Keep a subtitle copy. Animate a copy.</text>
    <text x="48" y="156" fill="#aaaab3" font-size="27">Duplicate your sequence before converting.</text>

    <rect x="40" y="190" width="880" height="180" rx="16" fill="#19191d" stroke="#37373e"/>
    <text x="65" y="232" fill="#f4f4f5" font-size="29" font-weight="650">Start with native captions</text>
    <text x="70" y="290" fill="#b9b3ff" font-size="27" font-weight="650">C1</text>
    <g fill="#4d456e" stroke="#9185c5"><rect x="139" y="256" width="235" height="48" rx="5"/><rect x="386" y="256" width="220" height="48" rx="5"/><rect x="618" y="256" width="270" height="48" rx="5"/></g>
    <g fill="#eee9ff" font-size="24" font-weight="600"><text x="256" y="288" text-anchor="middle">CREATE</text><text x="496" y="288" text-anchor="middle">EDIT</text><text x="753" y="288" text-anchor="middle">DELIVER</text></g>
    <text x="70" y="339" fill="#9b9ba6" font-size="27" font-weight="650">V1</text>
    <rect x="139" y="318" width="749" height="27" rx="4" fill="#303039"/>
    <text x="512" y="338" text-anchor="middle" fill="#aaaab3" font-size="20">Sample video</text>

    <path d="M480 383v17m-8-8 8 8 8-8" fill="none" stroke="#7f7f8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="93" y="416" width="774" height="76" rx="13" fill="#0d253d" stroke="#2867a1"/>
    <text x="480" y="441" text-anchor="middle" fill="#97cfff" font-size="23">IN THE COPY YOU WANT TO ANIMATE</text>
    <text x="480" y="479" text-anchor="middle" fill="#f4f4f5" font-size="29" font-weight="650">Graphics and Titles › Upgrade Caption to Graphic</text>
    <path d="M480 503v17m-8-8 8 8 8-8" fill="none" stroke="#7f7f8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="537" width="880" height="263" rx="16" fill="#19191d" stroke="#37373e"/>
    <text x="65" y="580" fill="#f4f4f5" font-size="29" font-weight="650">Keep both delivery options</text>
    <text x="65" y="623" fill="#b9b3ff" font-size="24" font-weight="600">Subtitle sequence</text>
    <text x="65" y="661" fill="#b9b3ff" font-size="26" font-weight="650">C1</text>
    <g fill="#4d456e" stroke="#9185c5"><rect x="139" y="631" width="235" height="42" rx="5"/><rect x="386" y="631" width="220" height="42" rx="5"/><rect x="618" y="631" width="270" height="42" rx="5"/></g>
    <g fill="#eee9ff" font-size="22"><text x="256" y="659" text-anchor="middle">Native text</text><text x="496" y="659" text-anchor="middle">Native text</text><text x="753" y="659" text-anchor="middle">SRT source</text></g>
    <text x="65" y="715" fill="#82c7ff" font-size="24" font-weight="600">Animation sequence</text>
    <text x="65" y="754" fill="#82c7ff" font-size="26" font-weight="650">V2</text>
    <g fill="#224565" stroke="#448ac8"><rect x="139" y="724" width="235" height="42" rx="5"/><rect x="386" y="724" width="220" height="42" rx="5"/><rect x="618" y="724" width="270" height="42" rx="5"/></g>
    <g fill="#d2ebff" font-size="22"><text x="256" y="752" text-anchor="middle">Graphic</text><text x="496" y="752" text-anchor="middle">Graphic</text><text x="753" y="752" text-anchor="middle">Graphic</text></g>

    <text x="48" y="846" fill="#b5b5ba" font-size="25">Graphics render into the picture. Keep native captions for SRT.</text>
    <text x="48" y="880" fill="#777783" font-size="20">Workflow illustration · Simplified timelines, not a Premiere screenshot</text>
  </g>
</svg>
