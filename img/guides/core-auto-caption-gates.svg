<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title description">
<title id="title">Four automatic caption checkpoints</title><desc id="description">Check audible source speech, transcript accuracy, caption track creation and final delivery separately. Fix the first stage that fails rather than repeating work that is already correct.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern></defs>
<rect width="960" height="1080" rx="24" fill="#101013"/><rect width="960" height="1080" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="48" y="62" font-size="23" fill="#ffeb3b" font-weight="700">CAPTION WORKFLOWS</text><text x="48" y="124" font-size="45" fill="#f4f4f5" font-weight="700">Check the first failed stage</text><text x="48" y="170" font-size="27" fill="#b5b5bf" font-weight="400">Automatic captions still need a review pass.</text><rect x="40" y="211" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><rect x="59" y="236" width="58" height="58" rx="29" fill="#24242c" stroke="#b9acff"/><text x="78" y="277" font-size="32" fill="#b9acff" font-weight="700">1</text><text x="139" y="266" font-size="24" fill="#b9acff" font-weight="700">AUDIO</text><text x="139" y="314" font-size="30" fill="#f4f4f5" font-weight="650">Can you hear the intended speech?</text><text x="139" y="356" font-size="24" fill="#b5b5bf" font-weight="400">Check the chosen audio source and language.</text><path d="M87 385L87 409" fill="none" stroke="#b9acff" stroke-width="3"/><rect x="40" y="409" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><rect x="59" y="434" width="58" height="58" rx="29" fill="#24242c" stroke="#64bdff"/><text x="78" y="475" font-size="32" fill="#64bdff" font-weight="700">2</text><text x="139" y="464" font-size="24" fill="#64bdff" font-weight="700">TRANSCRIPT</text><text x="139" y="512" font-size="30" fill="#f4f4f5" font-weight="650">Are the words present and correct?</text><text x="139" y="554" font-size="24" fill="#b5b5bf" font-weight="400">Review names and numbers before captions.</text><path d="M87 583L87 607" fill="none" stroke="#64bdff" stroke-width="3"/><rect x="40" y="607" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><rect x="59" y="632" width="58" height="58" rx="29" fill="#24242c" stroke="#60dca9"/><text x="78" y="673" font-size="32" fill="#60dca9" font-weight="700">3</text><text x="139" y="662" font-size="24" fill="#60dca9" font-weight="700">CAPTION TRACK</text><text x="139" y="710" font-size="30" fill="#f4f4f5" font-weight="650">Do timed caption clips exist?</text><text x="139" y="752" font-size="24" fill="#b5b5bf" font-weight="400">Create captions, then check visibility and timing.</text><path d="M87 781L87 805" fill="none" stroke="#60dca9" stroke-width="3"/><rect x="40" y="805" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><rect x="59" y="830" width="58" height="58" rx="29" fill="#24242c" stroke="#ffeb3b"/><text x="78" y="871" font-size="32" fill="#ffeb3b" font-weight="700">4</text><text x="139" y="860" font-size="24" fill="#ffeb3b" font-weight="700">DELIVERY</text><text x="139" y="908" font-size="30" fill="#f4f4f5" font-weight="650">Does the exported result contain them?</text><text x="139" y="950" font-size="24" fill="#b5b5bf" font-weight="400">Check burn-in, sidecar or embedded delivery.</text>
<text x="48" y="1043" font-size="21" fill="#81818d" font-weight="400">Workflow illustration · Captions Gen guides</text></g></svg>
