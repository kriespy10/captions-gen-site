<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title description">
<title id="title">Three different caption treatments</title><desc id="description">A native Single Word layout shows one word at a time. A manual graphic can use keyframes. A spoken-word highlight emphasizes a word inside a longer phrase. Graphics require a separate subtitle workflow for SRT.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern></defs>
<rect width="960" height="1080" rx="24" fill="#101013"/><rect width="960" height="1080" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="48" y="62" font-size="23" fill="#ffeb3b" font-weight="700">CAPTION WORKFLOWS</text><text x="48" y="124" font-size="45" fill="#f4f4f5" font-weight="700">Three ways to show the words</text><text x="48" y="170" font-size="27" fill="#b5b5bf" font-weight="400">Grouping, motion and word highlighting differ.</text><rect x="40" y="211" width="880" height="230" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="254" font-size="24" fill="#b9acff" font-weight="700">NATIVE SINGLE WORD</text><text x="68" y="299" font-size="29" fill="#b5b5bf" font-weight="400">One timed word on a caption track</text><rect x="40" y="465" width="880" height="230" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="508" font-size="24" fill="#64bdff" font-weight="700">MANUAL GRAPHIC</text><text x="68" y="553" font-size="29" fill="#b5b5bf" font-weight="400">Keyframe a graphic on a video track</text><rect x="40" y="719" width="880" height="230" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="762" font-size="24" fill="#ffeb3b" font-weight="700">SPOKEN-WORD HIGHLIGHT</text><text x="68" y="807" font-size="29" fill="#b5b5bf" font-weight="400">Change emphasis within a whole phrase</text><rect x="313" y="325" width="334" height="76" rx="12" fill="#252234" stroke="#63558c"/><text x="385" y="378" font-size="43" fill="#f4f4f5" font-weight="750">CLEAR</text><text x="236" y="629" font-size="45" fill="#f4f4f5" font-weight="750">KEEP IT CLEAR</text><path d="M686 602L840 602" fill="none" stroke="#64bdff" stroke-width="3"/><path d="M700 593l9 9-9 9-9-9z" fill="#64bdff"/><path d="M753 593l9 9-9 9-9-9z" fill="#64bdff"/><path d="M824 593l9 9-9 9-9-9z" fill="#64bdff"/><text x="236" y="884" font-size="45" fill="#f4f4f5" font-weight="750">KEEP IT</text><rect x="450" y="834" width="222" height="70" rx="10" fill="#ffeb3b" stroke="#ffeb3b"/><text x="466" y="884" font-size="45" fill="#101013" font-weight="750">CLEAR</text><text x="68" y="1004" font-size="26" fill="#b5b5bf" font-weight="400">Keep a native caption copy when delivery also needs SRT.</text>
<text x="48" y="1043" font-size="21" fill="#81818d" font-weight="400">Workflow illustration · Captions Gen guides</text></g></svg>
