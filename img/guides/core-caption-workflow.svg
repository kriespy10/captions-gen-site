<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title description">
<title id="title">Three stages of a native caption workflow</title><desc id="description">Transcript text becomes timed native caption clips. Export can burn the captions into the picture, save an SRT sidecar or embed a stream in supported formats.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern></defs>
<rect width="960" height="1080" rx="24" fill="#101013"/><rect width="960" height="1080" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="48" y="62" font-size="23" fill="#ffeb3b" font-weight="700">CAPTION WORKFLOWS</text><text x="48" y="124" font-size="45" fill="#f4f4f5" font-weight="700">From speech to delivered captions</text><text x="48" y="170" font-size="27" fill="#b5b5bf" font-weight="400">Each stage has a different job in Premiere.</text><rect x="40" y="211" width="880" height="196" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="253" font-size="24" fill="#b9acff" font-weight="700">1  TRANSCRIPT</text><text x="68" y="309" font-size="35" fill="#f4f4f5" font-weight="650">The words, ready for correction</text><text x="68" y="361" font-size="31" fill="#b9acff" font-weight="400">“Keep the message clear.”</text><path d="M480 407L480 436" fill="none" stroke="#53535f" stroke-width="3"/><text x="508" y="434" font-size="23" fill="#b5b5bf" font-weight="400">Create captions</text><rect x="40" y="453" width="880" height="236" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="495" font-size="24" fill="#64bdff" font-weight="700">2  NATIVE CAPTION TRACK</text><text x="68" y="547" font-size="35" fill="#f4f4f5" font-weight="650">Timed clips, styled in Properties</text><rect x="146" y="583" width="238" height="63" rx="9" fill="#15344c" stroke="#3988bf"/><text x="164" y="624" font-size="28" fill="#d9efff" font-weight="400">Keep the</text><rect x="396" y="583" width="377" height="63" rx="9" fill="#15344c" stroke="#3988bf"/><text x="414" y="624" font-size="28" fill="#d9efff" font-weight="400">message clear.</text><text x="69" y="625" font-size="27" fill="#64bdff" font-weight="700">C1</text><path d="M480 689L480 719" fill="none" stroke="#53535f" stroke-width="3"/><text x="508" y="716" font-size="23" fill="#b5b5bf" font-weight="400">Export</text><rect x="40" y="737" width="880" height="263" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="779" font-size="24" fill="#ffeb3b" font-weight="700">3  DELIVERY</text><text x="68" y="833" font-size="29" fill="#f4f4f5" font-weight="650">Burn in</text><text x="306" y="833" font-size="26" fill="#b5b5bf" font-weight="400">Visible text in the video picture</text><text x="68" y="895" font-size="29" fill="#f4f4f5" font-weight="650">Sidecar SRT</text><text x="306" y="895" font-size="26" fill="#b5b5bf" font-weight="400">A separate file to upload with the video</text><text x="68" y="957" font-size="29" fill="#f4f4f5" font-weight="650">Embed</text><text x="306" y="957" font-size="26" fill="#b5b5bf" font-weight="400">A caption stream in supported formats</text>
<text x="48" y="1043" font-size="21" fill="#81818d" font-weight="400">Workflow illustration · Captions Gen guides</text></g></svg>
