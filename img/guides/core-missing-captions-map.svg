<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title description">
<title id="title">Diagnose missing captions by stage</title><desc id="description">Separate absent caption clips, blank preview, missing delivered captions and graphics on video tracks. Each points to a different control or workflow.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern></defs>
<rect width="960" height="1080" rx="24" fill="#101013"/><rect width="960" height="1080" rx="24" fill="url(#grid)"/>
<g font-family="'Segoe UI',Arial,sans-serif"><text x="48" y="62" font-size="23" fill="#ffeb3b" font-weight="700">CAPTION WORKFLOWS</text><text x="48" y="124" font-size="45" fill="#f4f4f5" font-weight="700">Where did the captions disappear?</text><text x="48" y="170" font-size="27" fill="#b5b5bf" font-weight="400">Find the symptom before changing the project.</text><rect x="40" y="211" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><path d="M43 230v136" stroke="#b9acff" stroke-width="5"/><text x="70" y="254" font-size="23" fill="#b9acff" font-weight="700">NO CAPTION CLIPS</text><text x="70" y="306" font-size="33" fill="#f4f4f5" font-weight="650">Only a transcript?</text><text x="70" y="355" font-size="27" fill="#b5b5bf" font-weight="400">Create captions from the transcript.</text><rect x="40" y="409" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><path d="M43 428v136" stroke="#64bdff" stroke-width="5"/><text x="70" y="452" font-size="23" fill="#64bdff" font-weight="700">BLANK PREVIEW</text><text x="70" y="504" font-size="33" fill="#f4f4f5" font-weight="650">Caption clips already exist?</text><text x="70" y="553" font-size="27" fill="#b5b5bf" font-weight="400">Check the track eye, playhead and appearance.</text><rect x="40" y="607" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><path d="M43 626v136" stroke="#60dca9" stroke-width="5"/><text x="70" y="650" font-size="23" fill="#60dca9" font-weight="700">BLANK EXPORTED VIDEO</text><text x="70" y="702" font-size="33" fill="#f4f4f5" font-weight="650">The preview shows the text?</text><text x="70" y="751" font-size="27" fill="#b5b5bf" font-weight="400">Check caption export and the player.</text><rect x="40" y="805" width="880" height="174" rx="18" fill="#19191e" stroke="#393941"/><path d="M43 824v136" stroke="#ffeb3b" stroke-width="5"/><text x="70" y="848" font-size="23" fill="#ffeb3b" font-weight="700">TEXT IS A GRAPHIC</text><text x="70" y="900" font-size="33" fill="#f4f4f5" font-weight="650">The clip sits on a video track?</text><text x="70" y="949" font-size="27" fill="#b5b5bf" font-weight="400">Check video output, clip timing and layers.</text>
<text x="48" y="1043" font-size="21" fill="#81818d" font-weight="400">Workflow illustration · Captions Gen guides</text></g></svg>
