<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description"><title id="title">Find the missing output</title><desc id="description">Native text should be visible Check Caption Tracks and burn-in settings. Check clip timing and the export range. Selectable captions need loading Load the matching sidecar or embedded stream. Use a player that supports the format. Animated clips use video-track output Check track, layer and graphic visibility. Inspect the actual new export.</desc><rect width="960" height="1000" rx="24" fill="#101013"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="20" font-weight="700" letter-spacing="2" fill="#ffeb3b">CAPTIONS GEN GUIDES</text>
