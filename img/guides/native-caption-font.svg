<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description"><title id="title">Native caption appearance and consistent Track Style examples</title><desc id="description">An illustrative settings card selects a fallback sans-serif family, bold weight, white fill and dark background beside a caption sample. Three different native caption examples below reuse that same appearance. Track Styles are for native captions, while graphics use separate controls. This is a design illustration, not an app screenshot.</desc><rect width="960" height="1000" rx="24" fill="#101013"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="21" fill="#ffdf49" font-weight="700" >NATIVE CAPTION DESIGN ILLUSTRATION</text><text x="48" y="108" font-size="37" fill="#f4f4f5" font-weight="700" >Choose an appearance. Reuse it consistently.</text><text x="48" y="153" font-size="26" fill="#b5b5bf" font-weight="400" >A Track Style applies an appearance to native captions.</text><rect x="40" y="190" width="345" height="350" rx="16" fill="#19191e" stroke="#393941"/><text x="64" y="231" font-size="22" fill="#b9acff" font-weight="700" >EXAMPLE SETTINGS</text><text x="64" y="279" font-size="23" fill="#a7a7b3" font-weight="400" >Family</text><text x="64" y="308" font-size="27" fill="#f4f4f5" font-weight="650" >Sans-serif fallback</text><text x="64" y="341" font-size="23" fill="#a7a7b3" font-weight="400" >Weight</text><text x="64" y="370" font-size="27" fill="#f4f4f5" font-weight="650" >Bold</text><text x="64" y="403" font-size="23" fill="#a7a7b3" font-weight="400" >Fill</text><text x="64" y="432" font-size="27" fill="#f4f4f5" font-weight="650" >White</text><text x="64" y="465" font-size="23" fill="#a7a7b3" font-weight="400" >Background</text><text x="64" y="494" font-size="27" fill="#f4f4f5" font-weight="650" >Dark</text><rect x="419" y="190" width="501" height="350" rx="16" fill="#19191e" stroke="#393941"/><text x="443" y="231" font-size="22" fill="#64bdff" font-weight="700" >NATIVE CAPTION SAMPLE</text><svg x="443" y="253" width="453" height="258" viewBox="0 0 832 190" overflow="hidden" preserveAspectRatio="none"><rect width="832" height="190" rx="12" fill="#bbc9d1"/><circle cx="657" cy="59" r="69" fill="#d6dee3"/><path d="M0 90Q145 10 285 107T565 95T832 85V190H0Z" fill="#93aab8"/><path d="M0 146Q130 85 292 152T565 149T832 126V190H0Z" fill="#b4c4ce"/><rect x="68" y="30" width="122" height="145" rx="15" fill="#d3dce1" opacity=".5"/></svg><rect x="466" y="321" width="407" height="142" rx="12" fill="#101013" fill-opacity=".9"/><text x="669.5" y="373" font-size="41" fill="#ffffff" font-weight="700" text-anchor="middle" >Check the</text><text x="669.5" y="428" font-size="41" fill="#ffffff" font-weight="700" text-anchor="middle" >whole phrase.</text><path d="M390 363H411M402 356L411 363L402 370" stroke="#64bdff" stroke-width="3" fill="none"/><text x="48" y="589" font-size="23" fill="#ffdf49" font-weight="700" >ONE TRACK STYLE, THREE DIFFERENT CAPTIONS</text><rect x="40" y="614" width="280" height="216" rx="16" fill="#152638" stroke="#35475f"/><text x="60" y="651" font-size="20" fill="#64bdff" font-weight="700" >C1 · Caption 1</text><rect x="54" y="674" width="252" height="117" rx="10" fill="#101013" fill-opacity=".92"/><text x="180" y="721" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" >Keep the</text><text x="180" y="762" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" >words clear.</text><rect x="340" y="614" width="280" height="216" rx="16" fill="#152638" stroke="#35475f"/><text x="360" y="651" font-size="20" fill="#64bdff" font-weight="700" >C1 · Caption 2</text><rect x="354" y="674" width="252" height="117" rx="10" fill="#101013" fill-opacity=".92"/><text x="480" y="721" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" >Check the</text><text x="480" y="762" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" >longest line.</text><rect x="640" y="614" width="280" height="216" rx="16" fill="#152638" stroke="#35475f"/><text x="660" y="651" font-size="20" fill="#64bdff" font-weight="700" >C1 · Caption 3</text><rect x="654" y="674" width="252" height="117" rx="10" fill="#101013" fill-opacity=".92"/><text x="780" y="721" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" >Review the</text><text x="780" y="762" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" >final export.</text><text x="48" y="880" font-size="27" fill="#f4f4f5" font-weight="400" >Different words. Same family, weight, fill and background.</text><text x="48" y="922" font-size="25" fill="#b5b5bf" font-weight="400" >Check long lines after styling. Graphics use separate controls.</text><text x="48" y="964" font-size="20" fill="#92929e" font-weight="400" >Not an app screenshot. Generic sans-serif; actual font rendering can vary.</text></g></svg>
