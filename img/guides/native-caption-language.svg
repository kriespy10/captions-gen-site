<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description"><title id="title">Recognize, then translate</title><desc id="description">Choose the language in the audio Check detection or a manual language choice. Wait for the required recognition pack. Correct the recognized text Check names, numbers and mixed-language parts. Create the intended caption track. Make a separate language version Review meaning, reading length and timing. Premiere translation uses cloud services.</desc><rect width="960" height="1000" rx="24" fill="#101013"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="20" font-weight="700" letter-spacing="2" fill="#ffeb3b">CAPTIONS GEN GUIDES</text>
