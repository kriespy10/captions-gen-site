<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description">
<title id="title">Aligned, offset and drifting captions</title><desc id="description">Three schematic timelines compare speech cues with caption starts. Aligned captions match the cues; constant delay has equal gaps; accumulating drift has increasing gaps. Positions are illustrative, not measured audio.</desc>
