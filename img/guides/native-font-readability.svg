<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description"><title id="title">Caption readability: low contrast versus clear separation</title><desc id="description">Two design examples use the identical sentence and illustrated background. The first has small low-contrast text on one dense line. The second uses larger bold white text, two lines and dark backing. These are illustrative sans-serif examples, not exact named-font specimens, app screenshots or universal sizing rules.</desc><rect width="960" height="1000" rx="24" fill="#101013"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="21" fill="#ffdf49" font-weight="700" >DESIGN ILLUSTRATION</text><text x="48" y="108" font-size="39" fill="#f4f4f5" font-weight="700" >Read the words, not just the font name</text><text x="48" y="153" font-size="26" fill="#b5b5bf" font-weight="400" >Same wording and background. Different reading conditions.</text><rect x="40" y="190" width="880" height="263" rx="16" fill="#19191e" stroke="#393941"/><text x="64" y="230" font-size="23" fill="#b9acff" font-weight="700" >HARDER TO READ</text><svg x="64" y="250" width="832" height="180" viewBox="0 0 832 190" overflow="hidden" preserveAspectRatio="none"><rect width="832" height="190" rx="12" fill="#bbc9d1"/><circle cx="657" cy="59" r="69" fill="#d6dee3"/><path d="M0 90Q145 10 285 107T565 95T832 85V190H0Z" fill="#93aab8"/><path d="M0 146Q130 85 292 152T565 149T832 126V190H0Z" fill="#b4c4ce"/><rect x="68" y="30" width="122" height="145" rx="15" fill="#d3dce1" opacity=".5"/></svg><text x="480" y="350" font-size="23" fill="#dce2e6" font-weight="400" text-anchor="middle" >The next step is to check the caption over changing footage.</text><rect x="40" y="475" width="880" height="313" rx="16" fill="#19191e" stroke="#393941"/><text x="64" y="515" font-size="23" fill="#64bdff" font-weight="700" >CLEARER SEPARATION</text><svg x="64" y="535" width="832" height="230" viewBox="0 0 832 190" overflow="hidden" preserveAspectRatio="none"><rect width="832" height="190" rx="12" fill="#bbc9d1"/><circle cx="657" cy="59" r="69" fill="#d6dee3"/><path d="M0 90Q145 10 285 107T565 95T832 85V190H0Z" fill="#93aab8"/><path d="M0 146Q130 85 292 152T565 149T832 126V190H0Z" fill="#b4c4ce"/><rect x="68" y="30" width="122" height="145" rx="15" fill="#d3dce1" opacity=".5"/></svg><rect x="88" y="577" width="784" height="147" rx="12" fill="#101013" fill-opacity=".88"/><text x="480" y="631" font-size="43" fill="#ffffff" font-weight="700" text-anchor="middle" >The next step is to check</text><text x="480" y="690" font-size="43" fill="#ffffff" font-weight="700" text-anchor="middle" >the caption over changing footage.</text><text x="64" y="833" font-size="27" fill="#b5b5bf" font-weight="400" >The visible changes:</text><rect x="64" y="854" width="244" height="55" rx="10" fill="#202028" stroke="#4d475e"/><text x="186.0" y="890" font-size="27" fill="#f4f4f5" font-weight="650" text-anchor="middle" >Larger type</text><rect x="322" y="854" width="255" height="55" rx="10" fill="#202028" stroke="#4d475e"/><text x="449.5" y="890" font-size="27" fill="#f4f4f5" font-weight="650" text-anchor="middle" >Shorter lines</text><rect x="591" y="854" width="305" height="55" rx="10" fill="#202028" stroke="#4d475e"/><text x="743.5" y="890" font-size="27" fill="#f4f4f5" font-weight="650" text-anchor="middle" >Dark backing</text><text x="48" y="946" font-size="26" fill="#ffdf49" font-weight="400" >Compare the actual export at its intended viewing size.</text><text x="48" y="980" font-size="20" fill="#92929e" font-weight="400" >Generic sans-serif example; font rendering can vary. No universal size rule.</text></g></svg>
