<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description"><title id="title">Bring prepared subtitles in</title><desc id="description">Text plus start and end times SRT carries wording and cue timestamps. Use a reviewed, correctly encoded file. Create a native caption track Import SRT, then drag it into the sequence. Check the opening, middle and ending. Keep the video and subtitles matched Burn in a picture version when needed. Keep a sidecar for subtitle-file delivery.</desc><rect width="960" height="1000" rx="24" fill="#101013"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="20" font-weight="700" letter-spacing="2" fill="#ffeb3b">CAPTIONS GEN GUIDES</text>
