<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description">
<title id="title">Vertical captions and platform-control occlusion</title><desc id="description">Two illustrative 9 by 16 video frames use the same caption. Generic player details hide part of the low caption in the first frame; the second moves it above the bottom overlay and clear of right-side controls. Overlay sizes and placements are conceptual, not universal safe dimensions.</desc>
