<text x="48" y="153" font-size="24" fill="#b7b7c0">Two illustrative 9:16 frames with generic player overlays.</text>
<text x="48" y="185" font-size="23" fill="#b7b7c0">Interfaces vary. These are not universal safe-zone dimensions.</text>
