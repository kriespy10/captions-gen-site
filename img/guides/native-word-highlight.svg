<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description">
<title id="title">A moving highlight across the same phrase</title><desc id="description">Three illustrated caption-preview crops retain MAKE IT CLEAR in the same position. MAKE is yellow first, IT next and CLEAR last. The changing emphasis is conceptual and does not claim measured speech alignment.</desc>
