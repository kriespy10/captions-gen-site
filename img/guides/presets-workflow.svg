<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title description">
  <title id="title">Choose the preset for your caption task</title>
  <desc id="description">Three different settings can be saved: a Create Captions preset controls segmentation, an Adobe Track Style controls native caption appearance, and a Captions Gen preset controls plugin design, grouping and animation. They do not store the transcript or font files.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#19191d"/><stop offset="1" stop-color="#101013"/></linearGradient>
  </defs>
  <rect width="960" height="1080" rx="24" fill="#101013"/>
  <rect width="960" height="1080" rx="24" fill="url(#grid)"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="48" y="66" fill="#ffeb3b" font-size="24" font-weight="700" letter-spacing="2">CAPTION WORKFLOWS</text>
    <text x="48" y="125" fill="#f4f4f5" font-size="46" font-weight="700" letter-spacing="-1">Choose what to save</text>
    <text x="48" y="168" fill="#aaaab3" font-size="27">Three presets, with different jobs in your edit.</text>

    <rect x="40" y="210" width="880" height="238" rx="18" fill="url(#surface)" stroke="#37373e"/>
    <rect x="40" y="228" width="5" height="202" rx="2" fill="#a8a2ff"/>
    <circle cx="92" cy="264" r="24" fill="#a8a2ff" fill-opacity=".14"/>
    <text x="92" y="273" text-anchor="middle" fill="#c0baff" font-size="25" font-weight="700">1</text>
    <text x="133" y="272" fill="#c0baff" font-size="25" font-weight="600">CREATE CAPTIONS PRESET</text>
    <text x="72" y="331" fill="#f4f4f5" font-size="39" font-weight="650">How the words are divided</text>
    <g fill="#292832" stroke="#454250"><rect x="72" y="358" width="222" height="55" rx="9"/><rect x="310" y="358" width="222" height="55" rx="9"/><rect x="548" y="358" width="140" height="55" rx="9"/></g>
    <g fill="#d4cfff" font-size="27" font-weight="600"><text x="183" y="394" text-anchor="middle">Length</text><text x="421" y="394" text-anchor="middle">Duration</text><text x="618" y="394" text-anchor="middle">Lines</text></g>
    <path d="M747 372h106m-106 13h83m-83 13h94" fill="none" stroke="#a8a2ff" stroke-width="5" stroke-linecap="round"/>

    <rect x="40" y="472" width="880" height="238" rx="18" fill="url(#surface)" stroke="#37373e"/>
    <rect x="40" y="490" width="5" height="202" rx="2" fill="#64b8ff"/>
    <circle cx="92" cy="526" r="24" fill="#0a84ff" fill-opacity=".16"/>
    <text x="92" y="535" text-anchor="middle" fill="#82c7ff" font-size="25" font-weight="700">2</text>
    <text x="133" y="534" fill="#82c7ff" font-size="25" font-weight="600">ADOBE TRACK STYLE</text>
    <text x="72" y="593" fill="#f4f4f5" font-size="39" font-weight="650">How native captions look</text>
    <g fill="#202a34" stroke="#384859"><rect x="72" y="620" width="190" height="55" rx="9"/><rect x="278" y="620" width="190" height="55" rx="9"/><rect x="484" y="620" width="190" height="55" rx="9"/></g>
    <g fill="#c3e6ff" font-size="27" font-weight="600"><text x="167" y="656" text-anchor="middle">Font</text><text x="373" y="656" text-anchor="middle">Size</text><text x="579" y="656" text-anchor="middle">Color</text></g>
    <text x="799" y="665" text-anchor="middle" fill="#f4f4f5" font-size="51" font-weight="700">Aa</text>
    <path d="M748 677h102" stroke="#64b8ff" stroke-width="4"/>

    <rect x="40" y="734" width="880" height="238" rx="18" fill="url(#surface)" stroke="#625c24"/>
    <rect x="40" y="752" width="5" height="202" rx="2" fill="#ffeb3b"/>
    <circle cx="92" cy="788" r="24" fill="#ffeb3b" fill-opacity=".12"/>
    <text x="92" y="797" text-anchor="middle" fill="#ffeb3b" font-size="25" font-weight="700">3</text>
    <text x="133" y="796" fill="#ffeb3b" font-size="25" font-weight="600">CAPTIONS GEN .CGPRESET</text>
    <text x="72" y="855" fill="#f4f4f5" font-size="39" font-weight="650">How the graphics animate</text>
    <g fill="#2a291b" stroke="#48452d"><rect x="72" y="882" width="194" height="55" rx="9"/><rect x="282" y="882" width="224" height="55" rx="9"/><rect x="522" y="882" width="232" height="55" rx="9"/></g>
    <g fill="#fff5a9" font-size="27" font-weight="600"><text x="169" y="918" text-anchor="middle">Design</text><text x="394" y="918" text-anchor="middle">Grouping</text><text x="638" y="918" text-anchor="middle">Animation</text></g>
    <path d="M800 915l15-19 13 26 17-43" fill="none" stroke="#ffeb3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="48" y="1021" fill="#b5b5ba" font-size="25">A preset saves settings, not the transcript or font files.</text>
    <text x="48" y="1055" fill="#777783" font-size="20">Workflow illustration · Captions Gen guides</text>
  </g>
</svg>
