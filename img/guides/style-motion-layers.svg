<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title description"><title id="title">Two places to add motion</title><desc id="description">A group entrance affects the whole phrase. Active-word emphasis follows word timing and affects the spoken word. These controls have different jobs.</desc><rect width="960" height="760" rx="24" fill="#101013"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="52" font-size="21" fill="#ffdf49" font-weight="700">WORKFLOW ILLUSTRATION</text><text x="48" y="110" font-size="40" fill="#f4f4f5" font-weight="700">Two places to add motion</text><text x="48" y="155" font-size="26" fill="#b5b5bf" font-weight="400">The group entrance and word emphasis do different jobs.</text><rect x="40" y="193" width="880" height="214" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="232" font-size="22" fill="#b9acff" font-weight="700">1  GROUP ENTRANCE</text><text x="68" y="277" font-size="32" fill="#f4f4f5" font-weight="650">The phrase arrives together</text><text x="68" y="322" font-size="27" fill="#b5b5bf" font-weight="400">In Bounce brings in the caption group.</text><text x="68" y="359" font-size="27" fill="#b5b5bf" font-weight="400">Changing it does not change which word is spoken.</text><rect x="40" y="427" width="880" height="230" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="466" font-size="22" fill="#64bdff" font-weight="700">2  ACTIVE-WORD EMPHASIS</text><text x="68" y="511" font-size="32" fill="#f4f4f5" font-weight="650">One word gets the focus</text><text x="68" y="556" font-size="27" fill="#b5b5bf" font-weight="400">Color, size and bounce follow the word timing.</text><text x="68" y="593" font-size="27" fill="#b5b5bf" font-weight="400">The other words remain readable beside it.</text><text x="68" y="701" font-size="27" fill="#ffdf49" font-weight="400">Too busy? Reduce one effect, then play the phrase again.</text><text x="48" y="730" font-size="21" fill="#81818d" font-weight="400">Illustration, not a native app screenshot · Captions Gen guides</text></g></svg>
