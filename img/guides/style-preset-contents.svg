<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title description"><title id="title">What a preset carries</title><desc id="description">A Captions Gen .cgpreset carries appearance, grouping, animation and font metadata. Media, transcript, font files and model files are not included.</desc><rect width="960" height="820" rx="24" fill="#101013"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="52" font-size="21" fill="#ffdf49" font-weight="700">WORKFLOW ILLUSTRATION</text><text x="48" y="110" font-size="40" fill="#f4f4f5" font-weight="700">What a preset carries</text><text x="48" y="155" font-size="26" fill="#b5b5bf" font-weight="400">A .cgpreset is a set of instructions, not the finished captions.</text><rect x="40" y="195" width="880" height="222" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="234" font-size="22" fill="#b9acff" font-weight="700">IN THE PRESET</text><text x="68" y="279" font-size="32" fill="#f4f4f5" font-weight="650">Design, grouping and animation</text><text x="68" y="324" font-size="27" fill="#b5b5bf" font-weight="400">Colors, sizes, word limits and animation settings.</text><text x="68" y="361" font-size="27" fill="#b5b5bf" font-weight="400">Font metadata identifies the requested font.</text><rect x="40" y="439" width="880" height="258" rx="18" fill="#19191e" stroke="#393941"/><text x="68" y="478" font-size="22" fill="#64bdff" font-weight="700">SUPPLY SEPARATELY</text><text x="68" y="523" font-size="32" fill="#f4f4f5" font-weight="650">Fonts, footage and speech models</text><text x="68" y="568" font-size="27" fill="#b5b5bf" font-weight="400">Font files are not installed by importing a preset.</text><text x="68" y="605" font-size="27" fill="#b5b5bf" font-weight="400">Media, transcript and model files are not included.</text><text x="68" y="642" font-size="27" fill="#b5b5bf" font-weight="400">Generate and review captions in the target host.</text><text x="68" y="753" font-size="27" fill="#ffdf49" font-weight="400">A MOGRT or Adobe style is a different file format.</text><text x="48" y="790" font-size="21" fill="#81818d" font-weight="400">Illustration, not a native app screenshot · Captions Gen guides</text></g></svg>
